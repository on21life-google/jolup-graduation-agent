sonar.projectKey=jolup-roadmap
sonar.projectName=Graduation Roadmap
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Product code and tests are disjoint; no GitHub connection is required.
sonar.sources=app.py,jolup,scripts
sonar.tests=tests
sonar.inclusions=**/*.py
sonar.test.inclusions=tests/**/*.py

# Intentional Red/Green/Refactor exercises are not product quality metrics.
# Private/local data and generated artifacts never enter the analysis scope.
sonar.exclusions=learning/**,.venv/**,venv/**,.git/**,.codex/**,.agents/**,.cache/**,.pytest_cache/**,.scannerwork/**,**/__pycache__/**,data/**,reports/**,docs/**,output/**
sonar.coverage.exclusions=tests/**,learning/**
sonar.cpd.exclusions=learning/**
sonar.python.coverage.reportPaths=reports/quality/coverage.xml

# A local ZIP handoff has no SCM history. Do not infer new-code coverage from Git.
sonar.scm.disabled=true
