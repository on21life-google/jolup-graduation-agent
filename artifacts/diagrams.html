let mermaid, mode='light';const histories={};
const gallery=document.querySelector('#gallery'), status=document.querySelector('#status');
const file=document.querySelector('#file'), type=document.querySelector('#type'), jump=document.querySelector('#jump');
function option(select,value,label){const item=document.createElement('option');item.value=value;item.textContent=label;select.append(item);}
[...new Set(blocks.map(x=>x.file))].forEach(x=>option(file,x,x));
[...new Set(blocks.map(x=>x.type))].forEach(x=>option(type,x,x));
blocks.forEach((block,index)=>{const card=document.createElement('section');card.id=block.id;card.className='card';card.dataset.file=block.file;card.dataset.type=block.type;card.dataset.status='pending';const head=document.createElement('div');head.className='card-head';const h=document.createElement('h2');h.textContent=`${index+1}. ${block.heading}`;const meta=document.createElement('div');meta.className='meta';meta.textContent=`${block.file}:${block.line} · ${block.type} · `;const badge=document.createElement('span');badge.className='status';badge.textContent='대기';meta.append(badge);head.append(h,meta);const canvas=document.createElement('div');canvas.className=`canvas ${block.type}`;const details=document.createElement('details');details.className='source';const summary=document.createElement('summary');summary.textContent='Mermaid 원문';const pre=document.createElement('pre');pre.textContent=block.code;details.append(summary,pre);card.append(head,canvas,details);gallery.append(card);option(jump,block.id,`${index+1}. ${block.heading} (${block.type})`);});
function filter(){document.querySelectorAll('.card').forEach(card=>card.classList.toggle('hidden',(file.value&&card.dataset.file!==file.value)||(type.value&&card.dataset.type!==type.value)));}
file.onchange=filter;type.onchange=filter;document.querySelector('#fit').onclick=()=>{const fit=document.body.classList.toggle('fit');document.querySelector('#fit').textContent=fit?'원래 글자 크기로 보기':'화면 폭에 맞추기';};jump.onchange=()=>{if(!jump.value)return;file.value='';type.value='';filter();document.getElementById(jump.value).scrollIntoView({behavior:'instant',block:'start'});};
function publish(){const record={...manifest,themes:histories,claim_boundary:'Theme counts describe completed attempts only. A missing or blocked theme is not a pass. Representative visual review, semantic correctness and other viewers require separate evidence.'};document.querySelector('#validation-record').textContent=JSON.stringify(record,null,2);return record;}
document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(publish(),null,2)],{type:'application/json'}));a.download='mermaid-render-results.json';a.click();URL.revokeObjectURL(a.href);};
async function renderAll(){const button=document.querySelector('#theme');button.disabled=true;document.body.classList.toggle('dark',mode==='dark');button.textContent=mode==='light'?'어두운 배경 보기':'밝은 배경 보기';
 mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:mode==='dark'?'dark':'base',fontFamily:'-apple-system, BlinkMacSystemFont, Malgun Gothic, sans-serif',themeVariables:{fontSize:'17px',treeView:{labelFontSize:'18px',labelColor:mode==='dark'?'#eef3ff':'#17243b',lineColor:mode==='dark'?'#bdcce5':'#45536a'}},treeView:{rowIndent:24,paddingY:7},flowchart:{htmlLabels:true,useMaxWidth:false},sequence:{useMaxWidth:false}});
 const results=[];
 for(let index=0;index<blocks.length;index++){const block=blocks[index],card=document.getElementById(block.id),canvas=card.querySelector('.canvas'),badge=card.querySelector('.status');status.textContent=`${mode==='light'?'밝은':'어두운'} 배경 검증 ${index+1}/${blocks.length}`;canvas.replaceChildren();try{const result=await mermaid.render(`svg-${mode}-${index}`,block.code);canvas.innerHTML=result.svg;const svg=canvas.querySelector('svg');const box=svg.viewBox.baseVal;svg.style.width=box.width+'px';svg.style.height=box.height+'px';card.dataset.status='pass';badge.textContent='렌더 완료';badge.className='status pass';results.push({id:block.id,status:'pass',width:canvas.querySelector('svg').getBoundingClientRect().width,height:canvas.querySelector('svg').getBoundingClientRect().height});}catch(error){card.dataset.status='fail';badge.textContent='렌더 실패';badge.className='status fail';canvas.textContent=String(error);results.push({id:block.id,status:'fail',error:String(error)});}}
 histories[mode]={completed_at:new Date().toISOString(),passed:results.filter(x=>x.status==='pass').length,failed:results.filter(x=>x.status==='fail').length,results};status.textContent=`${mode==='light'?'밝은':'어두운'} 배경 · ${histories[mode].passed}/${blocks.length}개 렌더 완료 · 실패 ${histories[mode].failed}개`;publish();button.disabled=false;
}
document.querySelector('#theme').onclick=()=>{mode=mode==='light'?'dark':'light';renderAll();};
try{mermaid=(await import('https://cdn.jsdelivr.net/npm/mermaid@11.14.0/dist/mermaid.esm.min.mjs')).default;await renderAll();}catch(error){status.textContent='Mermaid 로드 실패: '+String(error);document.querySelectorAll('details.source').forEach(x=>x.open=true);histories[mode]={blocked:true,error:String(error)};publish();}
